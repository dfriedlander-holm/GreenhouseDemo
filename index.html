<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Hook: The Greenhouse Effect</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        canvas {
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border-radius: 12px;
        }
    </style>
</head>
<body>

<script>
let photons = [];
let carbon, oxygenL, oxygenR;
let vibrationEnergy = 0;
let radFreq;

function setup() {
  createCanvas(800, 550);
  
  // UI Container
  let uiContainer = createDiv('');
  uiContainer.position(30, 30);
  
  let label = createSpan('<b>LIGHT SOURCE SELECTION:</b><br>');
  label.parent(uiContainer);
  
  radFreq = createRadio();
  radFreq.option('0.2', 'Visible (Sunlight) ');
  radFreq.option('0.8', 'Infrared (Earth Heat) ');
  radFreq.selected('0.2');
  radFreq.parent(uiContainer);
  
  // UI Styling
  uiContainer.style('background', 'rgba(255, 255, 255, 0.95)');
  uiContainer.style('padding', '15px');
  uiContainer.style('border-radius', '8px');
  uiContainer.style('border', '2px solid #333');
  uiContainer.style('z-index', '100');

  // Initialize molecule positions - Centered
  carbon = createVector(width/2, height/2 + 40);
  oxygenL = createVector(width/2 - 90, height/2 + 40);
  oxygenR = createVector(width/2 + 90, height/2 + 40);
}

function draw() {
  background(255);
  
  // 1. Draw Environmental Zones
  noStroke();
  fill(40, 40, 45); // OUTER SPACE: Dark Grey
  rect(0, 0, width, 140); 
  
  fill(120, 100, 80, 50); // EARTH SURFACE: Ground Green/Brown
  rect(0, height-80, width, 80); 

  // 2. Labels
  textAlign(LEFT);
  textSize(16); 
  textStyle(BOLD);
  
  fill(255); 
  text("OUTER SPACE (VACUUM)", 30, 130);
  
  fill(60); 
  text("EARTH'S SURFACE", 30, height-95);

  // 3. Photon Generation Logic
  if (frameCount % 15 == 0) {
    let f = parseFloat(radFreq.value());
    if (f < 0.5) {
      // Sunlight comes from the TOP
      photons.push(new Photon(random(width), -50, f));
    } else {
      // Heat comes from the BOTTOM
      photons.push(new Photon(random(width), height-85, f));
    }
  }

  // 4. Quantum Molecule Physics
  let resonantFreq = 0.8;
  vibrationEnergy *= 0.97; 
  
  let vib = sin(frameCount * 0.4) * vibrationEnergy * 25;
  
  // Draw Chemical Bonds (Springs)
  stroke(180); strokeWeight(6);
  line(carbon.x, carbon.y, oxygenL.x - vib, oxygenL.y + vib);
  line(carbon.x, carbon.y, oxygenR.x + vib, oxygenR.y + vib);

  // Draw Atoms
  stroke(0); strokeWeight(1.5);
  fill(40); ellipse(carbon.x, carbon.y, 65, 65); // Carbon
  fill(255, 60, 60); 
  ellipse(oxygenL.x - vib, oxygenL.y + vib, 50, 50); // Oxygen L
  ellipse(oxygenR.x + vib, oxygenR.y + vib, 50, 50); // Oxygen R
  
  fill(255); textAlign(CENTER); textSize(20);
  text("C", carbon.x, carbon.y+7);
  text("O", oxygenL.x - vib, oxygenL.y+7);
  text("O", oxygenR.x + vib, oxygenR.y+7);

  // 5. Interaction Loop
  for (let i = photons.length - 1; i >= 0; i--) {
    photons[i].update();
    photons[i].display();

    let d = dist(photons[i].pos.x, photons[i].pos.y, carbon.x, carbon.y);
    if (d < 45) {
      // Check resonance
      if (abs(photons[i].freq - resonantFreq) < 0.1) {
        vibrationEnergy = 1.2; 
        photons.splice(i, 1);
      }
    } else if (photons[i].pos.y < -100 || photons[i].pos.y > height + 100) {
      // Remove photons that leave the simulation area
      photons.splice(i, 1);
    }
  }

  // 6. Data Readout (Warming Meter)
  drawWarmingMeter(width - 200, height - 150, vibrationEnergy);
}

function drawWarmingMeter(x, y, energy) {
  push();
  translate(x, y);
  fill(0); textAlign(LEFT); textSize(14);
  text("ATMOSPHERIC WARMING", 0, -15);
  fill(230); rect(0, 0, 160, 30, 5);
  fill(255, 69, 0); 
  rect(0, 0, map(energy, 0, 1.2, 0, 160), 30, 5);
  pop();
}

class Photon {
  constructor(x, y, f) {
    this.pos = createVector(x, y);
    this.freq = f;
    // Set direction based on frequency
    if (this.freq < 0.5) {
      this.vel = createVector(0, 4.5); // Sunlight moves DOWN
    } else {
      this.vel = createVector(0, -4.5); // Earth Heat moves UP
    }
  }

  update() {
    this.pos.add(this.vel);
  }

  display() {
    stroke(this.freq > 0.5 ? '#E91E63' : '#FFD600');
    strokeWeight(3); noFill();
    beginShape();
    // Reversing the drawing direction of the squiggle so it points the right way
    let dir = this.vel.y > 0 ? -1 : 1;
    for (let i = 0; i < 25; i++) {
      let xOff = sin(i * 0.4 + frameCount * 0.7) * 7;
      vertex(this.pos.x + xOff, this.pos.y + (i * dir));
    }
    endShape();
  }
}
</script>

</body>
</html>
